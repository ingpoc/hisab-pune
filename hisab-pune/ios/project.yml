name: HisabPune
options:
  bundleIdPrefix: in.hisab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HisabPune:
    type: application
    platform: iOS
    sources:
      - path: HisabPune
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.hisab.pune
        INFOPLIST_FILE: HisabPune/Info.plist
        CODE_SIGN_ENTITLEMENTS: HisabPune/HisabPune.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    entitlements:
      path: HisabPune/HisabPune.entitlements
    dependencies:
      - target: HisabPuneWidget
        embed: true
    info:
      path: HisabPune/Info.plist
      properties:
        CFBundleDisplayName: Hisab
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Hisab uses your location to show who answers for your street and to pin civic issues.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        HisabAPIBaseURL: http://127.0.0.1:8787

  HisabPuneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HisabPuneWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.hisab.pune.widget
        INFOPLIST_FILE: HisabPuneWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: HisabPuneWidget/HisabPuneWidget.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    entitlements:
      path: HisabPuneWidget/HisabPuneWidget.entitlements
    info:
      path: HisabPuneWidget/Info.plist
      properties:
        CFBundleDisplayName: Hisab locality
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  HisabPune:
    build:
      targets:
        HisabPune: all
        HisabPuneWidget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
