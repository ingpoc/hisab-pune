# Hisab Pune — Render Blueprint
#
# Lives at the repo root (Render's default discovery path). The Node app is in
# hisab-pune/, so the web service sets rootDir: hisab-pune.
#
# Free tier: 512MB web (spins down after 15 min idle), 1GB Postgres, ephemeral
# disk. Do not attach a disk or any paid instance type.
#
# This workspace already has a free Postgres (agentguard-preprod-postgres,
# virginia). Render allows one free Postgres per workspace — applying this
# Blueprint may require replacing that instance or upgrading a plan.

databases:
  - name: hisab-pune-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    diskSizeGB: 1

services:
  - type: web
    name: hisab-pune
    runtime: node
    plan: free
    region: singapore
    rootDir: hisab-pune
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hisab-pune-db
          property: connectionString
